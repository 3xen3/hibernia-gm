<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<title>Hibernia GM Ekranı</title>
<script>try{var hxt=localStorage.getItem("hibernia-tema");if(hxt==="dark"||hxt==="light")document.documentElement.setAttribute("data-theme",hxt);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Grenze:wght@600;700&display=swap">
<style>
:root{--bg:#E6EBE8;--leaf:#F7F9F7;--ink:#18201C;--muted:#55615A;--line:#C8D1CB;--moon:#A3262F;--moon-soft:#F6DADA;--ok:#2D7A4C;
  --f-display:"Grenze","Palatino Linotype",Georgia,serif;--f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101412;--leaf:#191F1C;--ink:#E4E9E5;--muted:#97A39C;--line:#2D3732;--moon:#E46A63;--moon-soft:#3B1C1D;--ok:#6CC08F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101412;--leaf:#191F1C;--ink:#E4E9E5;--muted:#97A39C;--line:#2D3732;--moon:#E46A63;--moon-soft:#3B1C1D;--ok:#6CC08F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.gate{width:100%;max-width:380px}
.moon{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#e8858d 0,var(--moon) 46%,#5b1218 100%);box-shadow:0 0 0 6px var(--moon-soft);margin:0 0 18px}
h1{font:700 40px/1 var(--f-display);margin:0;letter-spacing:.01em}
.sub{margin:6px 0 26px;color:var(--muted);font-size:15px}
form{background:var(--leaf);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
input{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--moon);outline-offset:1px;border-color:transparent}
button{font:600 16px var(--f-body);color:#fff;background:var(--moon);border:0;border-radius:6px;padding:11px 14px;cursor:pointer;margin-top:4px}
button[disabled]{opacity:.6;cursor:progress}
.links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px}
button.link{background:none;color:var(--muted);font:500 14px var(--f-body);padding:2px;margin:0;text-decoration:underline;text-underline-offset:3px}
.msg{min-height:22px;margin:14px 2px 0;font-size:14px;color:var(--muted)}
.msg.err{color:var(--moon)}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js?v=8f3a88caeb06"></script>
</head>
<body>
<main class="gate">
  <div class="moon" aria-hidden="true"></div>
  <h1>Hibernia</h1>
  <p class="sub">GM ekranı · yalnızca davetli hesap</p>
  <form id="f" hidden autocomplete="on">
    <label id="eml">E-posta<input type="email" id="em" name="email" autocomplete="username" required></label>
    <label id="pwl"><span id="pwt">Şifre</span><input type="password" id="pw" name="password" autocomplete="current-password" required></label>
    <label id="pw2l" hidden>Şifre tekrar<input type="password" id="pw2" name="password2" autocomplete="new-password"></label>
    <button id="go" type="submit">Giriş yap</button>
    <div class="links"><button id="sw" type="button" class="link">İlk kez mi giriyorsun? Şifreni belirle</button><button id="fg" type="button" class="link">Şifremi unuttum</button></div>
  </form>
  <p class="msg" id="msg" role="status">Açılıyor…</p>
  <p class="foot">Tüm hakları saklıdır. İçerik şifrelidir ve yalnızca yetkili hesapla açılır.</p>
</main>
<script>
(function () {
  "use strict";
  var BUILD = "8f3a88caeb06";
  var SB_ALT = "https://unpkg.com/@supabase/supabase-js@2.117.3/dist/umd/supabase.js";
  var $ = function (id) { return document.getElementById(id); };
  var say = function (t, err) { var m = $("msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); };
  function loadAlt() {
    return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = SB_ALT; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  async function gunzip(buf) {
    var ds = new DecompressionStream("gzip");
    return await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  }
  // Okuma isteklerinde takılan bağlantıyı 10 saniyede kesip yeniden dener
  async function tfetch(input, init) {
    init = init || {};
    var method = String(init.method || "GET").toUpperCase();
    if (method !== "GET") return fetch(input, init);
    for (var i = 0; i < 4; i++) {
      var ac = new AbortController(), to = setTimeout(function () { ac.abort(); }, 10000);
      try { var res = await fetch(input, Object.assign({}, init, { signal: ac.signal })); clearTimeout(to); if (i < 3 && res.status >= 502 && res.status <= 504) { await new Promise(function (r) { setTimeout(r, 800 * (i + 1)); }); continue; } return res; }
      catch (e) { clearTimeout(to); if (i === 3) throw e; await new Promise(function (r) { setTimeout(r, 800 * (i + 1)); }); }
    }
  }
  async function openApp(sb) {
    say("Anahtar alınıyor…");
    var r = await sb.from("app_key").select("k").eq("id", 1).maybeSingle();
    for (var t = 0; t < 3 && r.error && /fetch|network|abort/i.test(r.error.message || ""); t++) { say("Bağlantı yavaş, yeniden deneniyor…"); await new Promise(function (res) { setTimeout(res, 1500); }); r = await sb.from("app_key").select("k").eq("id", 1).maybeSingle(); }
    if (r.error || !r.data) { say(r.error ? "Anahtar okunamadı: " + r.error.message : "Bu hesabın ekrana erişim izni yok.", true); showForm(); return; }
    say("Ekran açılıyor…");
    var res = await fetch("app.enc?v=" + BUILD, { cache: "no-cache" });
    if (!res.ok) { say("Uygulama dosyası indirilemedi (" + res.status + ").", true); return; }
    var buf = new Uint8Array(await res.arrayBuffer());
    var key = await crypto.subtle.importKey("raw", b64(r.data.k), { name: "AES-GCM" }, false, ["decrypt"]);
    var plain;
    try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)); }
    catch (e) { say("Şifre çözülemedi: anahtar bu sürümle eşleşmiyor.", true); return; }
    var html = await gunzip(plain);
    document.open(); document.write(html); document.close();
  }
  var mode = "login";
  var MSG_SIGNUP = "Şifren en az 8 karakter olsun. Bu sayfaya yalnızca izin verilen e-posta kayıt olabilir.";
  function setMode(m, msg, err) {
    mode = m;
    $("eml").hidden = m === "newpw"; $("em").required = m !== "newpw";
    $("pwl").hidden = m === "reset"; $("pw").required = m !== "reset";
    $("pw2l").hidden = !(m === "signup" || m === "newpw"); $("pw2").required = !$("pw2l").hidden;
    $("pwt").textContent = m === "newpw" ? "Yeni şifre" : "Şifre";
    $("pw").autocomplete = m === "login" ? "current-password" : "new-password";
    $("go").textContent = { login: "Giriş yap", signup: "Hesabı oluştur", reset: "Sıfırlama bağlantısı gönder", newpw: "Yeni şifreyi kaydet" }[m];
    $("sw").textContent = m === "login" ? "İlk kez mi giriyorsun? Şifreni belirle" : "Giriş ekranına dön";
    $("sw").hidden = m === "newpw"; $("fg").hidden = m !== "login";
    $("go").disabled = false; say(msg || "", err);
  }
  function showForm() { $("f").hidden = false; $("go").disabled = false; setTimeout(function () { (mode === "newpw" ? $("pw") : $("em")).focus(); }, 30); }
  async function boot() {
    if (!window.supabase) { try { await loadAlt(); } catch (e) {} }
    var C = window.HIBERNIA_CONFIG;
    if (!window.supabase || !C) { say("Bağlantı kitaplığı yüklenemedi. İnternet bağlantını ya da reklam engelleyiciyi kontrol et.", true); return; }
    if (!window.DecompressionStream || !window.crypto || !crypto.subtle) { say("Bu tarayıcı çok eski. Chrome, Edge, Firefox ya da Safari'nin güncel sürümünü kullan.", true); return; }
    var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: true, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "hibernia-gm-auth" }, global: { fetch: tfetch } });
    $("sw").addEventListener("click", function () { setMode(mode === "login" ? "signup" : "login", mode === "login" ? MSG_SIGNUP : ""); showForm(); });
    $("fg").addEventListener("click", function () { setMode("reset", "E-postanı yaz; şifreni yenilemen için sana bir bağlantı gönderilecek."); showForm(); });
    $("f").addEventListener("submit", async function (e) {
      e.preventDefault();
      var em = $("em").value.trim(), pw = $("pw").value;
      if (mode === "reset") {
        $("go").disabled = true; say("Gönderiliyor…");
        var rr = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
        $("go").disabled = false;
        if (rr.error) {
          var rm = rr.error.message || "";
          say(/authori[sz]ed|sending|smtp|mail/i.test(rm) ? "Bu adrese mail gönderilemiyor. Yardımcı GM isen masa sahibinden sana geçici şifre vermesini iste." : /rate|limit|security purposes|seconds/i.test(rm) ? "Çok sık istendi; biraz bekleyip yeniden dene." : "Gönderilemedi: " + rm, true);
          return;
        }
        say("Bağlantı gönderildi. Gelen kutunu ve gereksiz klasörünü kontrol et, bağlantıya tıklayıp yeni şifreni belirle.");
        return;
      }
      if (mode === "newpw") {
        if (pw.length < 8) { say("Şifre en az 8 karakter olmalı.", true); return; }
        if (pw !== $("pw2").value) { say("İki şifre aynı değil.", true); return; }
        $("go").disabled = true; say("Kaydediliyor…");
        var nu = await sb.auth.updateUser({ password: pw });
        if (nu.error) { $("go").disabled = false; say(/different|same/i.test(nu.error.message) ? "Yeni şifre eskisinden farklı olmalı." : "Şifre değiştirilemedi: " + nu.error.message, true); return; }
        $("f").hidden = true; say("Şifren değişti.");
        openApp(sb).catch(function (err) { say("Açılamadı: " + (err && err.message || err), true); });
        return;
      }
      if (mode === "signup") {
        if (pw.length < 8) { say("Şifre en az 8 karakter olmalı.", true); return; }
        if (pw !== $("pw2").value) { say("İki şifre aynı değil.", true); return; }
        $("go").disabled = true; say("Hesap oluşturuluyor…");
        var u = await sb.auth.signUp({ email: em, password: pw });
        if (u.error) {
          var m = u.error.message || "";
          say(/already|registered|exists/i.test(m) ? "Bu e-postayla zaten hesap var; giriş yap." : /database|saving|kayıt kapalı/i.test(m) ? "Bu e-posta masaya eklenmemiş. Masa sahibi önce kendi ekranında Notlar › Veri › Ortak masa'dan bu adresi eklemeli (yazımı birebir aynı olmalı), sonra yeniden dene." : "Hesap oluşturulamadı: " + m, true);
          $("go").disabled = false; return;
        }
        if (!(u.data && u.data.session)) {
          var t = await sb.auth.signInWithPassword({ email: em, password: pw });
          if (t.error) { setMode("login", "Hesap oluştu. E-postana gelen onay bağlantısına tıkla, sonra buradan giriş yap."); return; }
        }
        $("f").hidden = true; openApp(sb).catch(function (err) { say("Açılamadı: " + (err && err.message || err), true); });
        return;
      }
      $("go").disabled = true; say("Giriş yapılıyor…");
      var r = await sb.auth.signInWithPassword({ email: em, password: pw });
      if (r.error) { say(/invalid/i.test(r.error.message) ? "E-posta ya da şifre yanlış." : /confirm/i.test(r.error.message) ? "E-posta henüz onaylanmamış: gelen kutundaki bağlantıya tıkla." : "Giriş yapılamadı: " + r.error.message, true); $("go").disabled = false; return; }
      $("f").hidden = true; openApp(sb).catch(function (err) { say("Açılamadı: " + (err && err.message || err), true); });
    });
    // Şifre sıfırlama bağlantısından gelindiyse: yeni şifre formu
    var hp = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    if (hp.get("access_token") || hp.get("error_code") || hp.get("error_description")) history.replaceState(null, "", location.pathname + location.search);
    if (hp.get("error_code") || (hp.get("error_description") && !hp.get("access_token"))) {
      var why = (hp.get("error_code") || "") + " " + (hp.get("error_description") || "");
      setMode("reset", /expired|invalid/i.test(why) ? "Bağlantının süresi dolmuş ya da daha önce kullanılmış. Yeni bağlantı iste." : "Bağlantı açılamadı: " + why, true); showForm(); return;
    }
    if (hp.get("access_token") && hp.get("type") === "recovery") {
      var ss = await sb.auth.setSession({ access_token: hp.get("access_token"), refresh_token: hp.get("refresh_token") || "" });
      if (ss.error) { setMode("reset", "Bağlantı geçersiz ya da süresi dolmuş. Yeni bağlantı iste.", true); showForm(); return; }
      setMode("newpw", "Yeni şifreni belirle (en az 8 karakter)."); showForm(); return;
    }
    var s = await sb.auth.getSession();
    if (s.data && s.data.session) openApp(sb).catch(function (err) { say("Açılamadı: " + (err && err.message || err), true); showForm(); });
    else { say(""); showForm(); }
  }
  boot();
})();
</script>
</body>
</html>
